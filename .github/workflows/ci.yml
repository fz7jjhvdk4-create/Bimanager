name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tester
        run: npm test

      - name: Bygg
        run: npm run build
        env:
          # Dummy-värden – sidorna är force-dynamic så ingen databas nås vid bygge
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: ci-dummy-secret
